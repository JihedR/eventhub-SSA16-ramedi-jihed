<article class="card" [class.active]="isFavorite()">
  <div class="media">
    <img [src]="event().imageUrl" [alt]="event().title" />
    <span class="category">{{ event().category | uppercase }}</span>
  </div>

  <div class="body">
    <h3>{{ event().title }}</h3>

    <p class="meta">
      <span>📅 {{ event().date | date: 'EEE d MMM yyyy' }}</span>
      <span>📍 {{ event().place }}</span>
    </p>

    @if (event().price === 0) {
      <span class="price free">Gratuit</span>
    } @else {
      <span class="price">{{ event().price | currency: 'TND' : 'symbol-narrow' : '1.0-0' }}</span>
    }

    <div class="actions">
      <a class="btn" [routerLink]="['/events', event().id]">Voir les détails</a>

      <button
        type="button"
        class="btn fav-btn"
        [class.is-fav]="isFavorite()"
        (click)="onToggleFavorite()"
        [attr.aria-pressed]="isFavorite()"
      >
        @if (isFavorite()) {
          ♥ Retirer des favoris
        } @else {
          ♡ Ajouter aux favoris
        }
      </button>
    </div>
  </div>
</article>
