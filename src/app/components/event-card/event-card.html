<div class="card" [class.active]="isFavorite()">
  <img [src]="event().imageUrl" [alt]="event().title" />

  <div class="content">
    <p class="category">{{ event().category | uppercase }}</p>
    <h3>{{ event().title }}</h3>
    <p>{{ event().date | date: 'dd/MM/yyyy' }} · {{ event().place }}</p>

    @if (event().price === 0) {
      <p>Gratuit</p>
    } @else {
      <p>{{ event().price | currency: 'TND' : 'symbol' : '1.0-0' }}</p>
    }

    <a [routerLink]="['/events', event().id]">Voir les détails</a>

    <button (click)="onFavoriteClick()">
      @if (isFavorite()) {
        Retirer des favoris
      } @else {
        Ajouter aux favoris
      }
    </button>
  </div>
</div>
