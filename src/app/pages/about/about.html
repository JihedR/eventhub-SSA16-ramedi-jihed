<h1>À propos</h1>
<p>
  EventHub présente les activités de l'association étudiante : ateliers, conférences et
  compétitions. On peut filtrer les événements par catégorie, voir leurs détails et les ajouter
  aux favoris.
</p>
<p>Projet réalisé avec Angular 21 dans le cadre du module Application côté client.</p>
